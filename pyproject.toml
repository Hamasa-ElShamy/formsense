[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "formsense"
version = "0.1.0"
description = "Explain every field of a web form before you fill it, and check your answers for mistakes and conflicts."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
formsense = "formsense.cli:main"

[tool.setuptools]
packages = ["formsense"]
