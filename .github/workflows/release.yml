name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - {os: ubuntu-latest, name: linux-x64}
          - {os: windows-latest, name: windows-x64}
          - {os: macos-latest, name: macos-arm64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install . pyinstaller pytest
      - run: python -m pytest tests -q
      - run: pyinstaller --onefile --name formsense run_formsense.py
      - name: Smoke test the built program
        shell: bash
        run: ./dist/formsense --help
      - name: Name the file
        shell: bash
        run: |
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          mv dist/formsense$ext dist/formsense-${{ matrix.name }}$ext
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/formsense-*
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/* --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes "Unsigned, standalone builds made by GitHub Actions from this tag. Windows SmartScreen and macOS Gatekeeper will probably warn because the files are not code-signed; check the SHA256 sums in SHA256SUMS.txt, or install from source instead. Each build only passed an automatic --help check in CI; no person has run the Windows or macOS builds."
